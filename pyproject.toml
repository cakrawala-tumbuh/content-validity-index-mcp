[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-validity-index-mcp"
dynamic = ["version"]
description = "MCP Server (FastMCP) untuk content-validity-index-backend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cakrawala Tumbuh", email = "andhitia.r@gmail.com" }]
keywords = ["mcp", "fastmcp", "model-context-protocol", "cvi", "content-validity-index"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastmcp>=2.0.0",
  "httpx>=0.27",
  "pydantic-settings>=2.0",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/cakrawala-tumbuh/content-validity-index-mcp"
Repository = "https://github.com/cakrawala-tumbuh/content-validity-index-mcp"
Issues = "https://github.com/cakrawala-tumbuh/content-validity-index-mcp/issues"

# Entrypoint CLI — dijalankan via `content-validity-index-mcp` setelah install.
[project.scripts]
content-validity-index-mcp = "content_validity_index_mcp.__main__:main"

# Versi dibaca dari src/content_validity_index_mcp/__init__.py (sumber tunggal).
[tool.hatch.version]
path = "src/content_validity_index_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/content_validity_index_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["content_validity_index_mcp"]
